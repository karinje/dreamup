<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamUp QA Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Modern Header */
        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Dropdown Filter */
        .filter-dropdown {
            position: relative;
        }

        .filter-select {
            appearance: none;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #e2e8f0;
            padding: 10px 40px 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 150px;
        }

        .filter-select:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .filter-dropdown::after {
            content: '▼';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
            font-size: 10px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Report Cards */
        .report-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .report-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .report-summary:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .report-summary-left {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .report-info {
            flex: 1;
        }

        .report-url {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .report-meta-line {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #94a3b8;
        }

        .report-meta-line span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .report-summary-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .status-pass { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .status-fail { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        .status-error { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .score {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 80px;
            text-align: center;
        }

        .expand-icon {
            font-size: 18px;
            color: #94a3b8;
            transition: transform 0.3s;
        }

        .report-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            opacity: 0.6;
            border-radius: 4px;
        }

        .delete-btn:hover {
            color: #ef4444;
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        .delete-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        /* Icon styles */
        .icon {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
        }

        /* Report Details */
        .report-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .report-card.expanded .report-details {
            max-height: 10000px;
        }

        .report-content {
            padding: 0 28px 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Meta Grid */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .meta-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 14px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Test Config Section */
        .config-section {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin: 15px 0;
        }

        .config-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .config-badge {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .config-badge:hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .config-badge-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .config-badge-value {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* Collapsible Sections */
        .collapsible-section {
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .section-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-count {
            background: rgba(102, 126, 234, 0.3);
            color: #a5b4fc;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .section-toggle {
            font-size: 14px;
            color: #94a3b8;
            transition: transform 0.3s;
        }

        .collapsible-section.expanded .section-toggle {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-section.expanded .section-content {
            max-height: 5000px;
        }

        .section-body {
            padding: 18px;
        }

        /* Issues */
        .issue {
            display: flex;
            gap: 12px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .issue.critical { border-left-color: #ef4444; }
        .issue.high { border-left-color: #f59e0b; }
        .issue.medium { border-left-color: #eab308; }
        .issue.low { border-left-color: #10b981; }

        .issue-icon {
            font-size: 22px;
        }

        .issue-content {
            flex: 1;
        }

        .issue-header {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .issue-text {
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* GIF Section */
        .gif-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .gif-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* Screenshots Grid */
        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .screenshot-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            background: rgba(0, 0, 0, 0.3);
        }

        .screenshot-item:hover {
            transform: scale(1.05);
        }

        .screenshot-item img {
            width: 100%;
            display: block;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 30px;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.05);
        }

        .modal-nav.prev {
            left: 30px;
        }

        .modal-nav.next {
            right: 30px;
        }

        .modal-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Loading & Empty States */
        .loading, .empty {
            text-align: center;
            padding: 80px 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty {
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        .empty h2 {
            margin-bottom: 15px;
            color: #e2e8f0;
            font-size: 24px;
        }

        .empty p {
            color: #94a3b8;
            font-size: 14px;
        }

        .empty code {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            color: #a5b4fc;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 32px; height: 32px; stroke: #667eea;">
                        <line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/>
                        <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
                        <rect x="2" y="6" width="20" height="12" rx="2" fill="none"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>DreamUp QA</h1>
                    <p>Autonomous Game Testing</p>
                </div>
            </div>
            <div class="filter-dropdown">
                <select class="filter-select" id="filter-select">
                    <option value="all">All Tests</option>
                    <option value="pass">Passed</option>
                    <option value="fail">Failed</option>
                    <option value="error">Errors</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar" id="stats-bar" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="total-tests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passed-tests">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failed-tests">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-score">0</div>
                <div class="stat-label">Avg Score</div>
            </div>
        </div>

        <div id="reports-container">
            <div class="loading">Loading reports...</div>
        </div>
    </div>

    <!-- Screenshot Modal -->
    <div class="modal" id="screenshot-modal">
        <span class="modal-close">&times;</span>
        <button class="modal-nav prev" onclick="navigateImage(-1)">‹</button>
        <button class="modal-nav next" onclick="navigateImage(1)">›</button>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Screenshot">
        </div>
        <div class="modal-counter" id="modal-counter"></div>
    </div>

    <script>
        let allReports = [];
        let currentFilter = 'all';
        let currentImageIndex = 0;
        let currentImages = [];

        // Load reports
        async function loadReports() {
            try {
                const response = await fetch('/api/reports');
                allReports = await response.json();
                updateStats();
                renderReports();
            } catch (error) {
                document.getElementById('reports-container').innerHTML = `
                    <div class="empty">
                        <h2>Error loading reports</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Update stats
        function updateStats() {
            if (allReports.length === 0) {
                document.getElementById('stats-bar').style.display = 'none';
                return;
            }

            document.getElementById('stats-bar').style.display = 'grid';
            
            const passed = allReports.filter(r => r.status === 'pass').length;
            const failed = allReports.filter(r => r.status === 'fail').length;
            const avgScore = Math.round(allReports.reduce((sum, r) => sum + r.playability_score, 0) / allReports.length);

            document.getElementById('total-tests').textContent = allReports.length;
            document.getElementById('passed-tests').textContent = passed;
            document.getElementById('failed-tests').textContent = failed;
            document.getElementById('avg-score').textContent = avgScore;
        }

        // Render reports
        function renderReports() {
            const container = document.getElementById('reports-container');
            
            const filtered = currentFilter === 'all' 
                ? allReports 
                : allReports.filter(r => r.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <h2>No reports found</h2>
                        <p>Run a test with: <code>npx tsx src/cli.ts &lt;game-url&gt;</code></p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((report, idx) => `
                <div class="report-card" id="report-${idx}">
                    <div class="report-summary" onclick="toggleReport(${idx})">
                        <div class="report-summary-left">
                            <button class="delete-btn" onclick="deleteReport('${report.id}', ${idx}, event)" title="Delete report">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"/>
                                </svg>
                            </button>
                            <div class="report-info">
                                <div class="report-url">${report.metadata.game_url}</div>
                                <div class="report-meta-line">
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                                        ${new Date(report.metadata.timestamp).toLocaleString()}
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 3"/></svg></span>
                                        ${(report.metadata.duration_ms / 1000).toFixed(1)}s
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
                                        ${report.screenshots.length} screenshots
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="report-summary-right">
                            <div class="status-badge status-${report.status}">
                                ${report.status}
                            </div>
                            <div class="score">${report.playability_score}<span style="font-size: 16px; color: #94a3b8;">/100</span></div>
                            <div class="expand-icon">▼</div>
                        </div>
                    </div>

                    <div class="report-details">
                        <div class="report-content">
                            <!-- Meta Information -->
                            <div class="meta-grid">
                                <div class="meta-item">
                                    <div class="meta-label">Confidence</div>
                                    <div class="meta-value">${report.confidence_score}%</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Issues Found</div>
                                    <div class="meta-value">${report.issues.length}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Browser</div>
                                    <div class="meta-value" style="font-size: 12px;">${report.metadata.browser}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">LLM Model</div>
                                    <div class="meta-value" style="font-size: 12px;">${report.metadata.llm_model}</div>
                                </div>
                            </div>

                            ${report.metadata.test_config ? `
                                <div class="config-section">
                                    <div class="config-title">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px; stroke: currentColor; fill: none;">
                                            <circle cx="12" cy="12" r="3"/>
                                            <path d="M12 1v6m0 6v6m5.2-13a6 6 0 0 1 4.8 4.8m-18 0A6 6 0 0 1 6.8 5.2M18 18a6 6 0 0 1-4.8 4.8m0-18A6 6 0 0 0 4.2 6"/>
                                        </svg>
                                        Test Configuration
                                    </div>
                                    <div class="config-badges">
                                        ${report.metadata.test_config.pause_interval ? `
                                            <div class="config-badge">
                                                <span class="config-badge-label">Pause:</span>
                                                <span class="config-badge-value">${report.metadata.test_config.pause_interval}s</span>
                                            </div>
                                        ` : ''}
                                        ${report.metadata.test_config.game_speed ? `
                                            <div class="config-badge">
                                                <span class="config-badge-label">Speed:</span>
                                                <span class="config-badge-value">${report.metadata.test_config.game_speed}%</span>
                                            </div>
                                        ` : ''}
                                        ${report.metadata.test_config.timeout_ms ? `
                                            <div class="config-badge">
                                                <span class="config-badge-label">Timeout:</span>
                                                <span class="config-badge-value">${(report.metadata.test_config.timeout_ms / 60000).toFixed(1)} min</span>
                                            </div>
                                        ` : ''}
                                        ${report.metadata.test_config.has_input_hints ? `
                                            <div class="config-badge">
                                                <span class="config-badge-value">✓ Input Hints</span>
                                            </div>
                                        ` : ''}
                                        ${report.metadata.test_config.has_game_context ? `
                                            <div class="config-badge">
                                                <span class="config-badge-value">✓ Game Context</span>
                                            </div>
                                        ` : ''}
                                        ${report.metadata.test_config.quick_test ? `
                                            <div class="config-badge">
                                                <span class="config-badge-value">⚡ Quick Test</span>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            ` : ''}

                            ${report.issues.length > 0 ? `
                                <div class="collapsible-section" id="issues-${idx}">
                                    <div class="section-header" onclick="toggleSection('issues-${idx}')">
                                        <div class="section-title">
                                            <span>Issues</span>
                                            <span class="section-count">${report.issues.length}</span>
                                        </div>
                                        <div class="section-toggle">▼</div>
                                    </div>
                                    <div class="section-content">
                                        <div class="section-body">
                                            ${report.issues.map(issue => `
                                                <div class="issue ${issue.severity}">
                                                    <div class="issue-icon">
                                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                                                            <circle cx="12" cy="12" r="10" fill="${issue.severity === 'critical' ? '#ef4444' : issue.severity === 'high' ? '#f59e0b' : issue.severity === 'medium' ? '#eab308' : '#10b981'}" stroke="none"/>
                                                            <path d="M12 8v4M12 16h.01" stroke="white" stroke-width="2"/>
                                                        </svg>
                                                    </div>
                                                    <div class="issue-content">
                                                        <div class="issue-header">${issue.severity} - ${issue.category}</div>
                                                        <div class="issue-text">${issue.description}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            ${report.gif ? `
                                <div class="collapsible-section" id="gif-${idx}">
                                    <div class="section-header" onclick="toggleSection('gif-${idx}')">
                                        <div class="section-title">
                                            <span>Gameplay Recording</span>
                                        </div>
                                        <div class="section-toggle">▼</div>
                                    </div>
                                    <div class="section-content">
                                        <div class="section-body">
                                            <div class="gif-container">
                                                <img src="/${report.gif}" alt="Gameplay GIF">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            ${report.screenshots.length > 0 ? `
                                <div class="collapsible-section" id="screenshots-${idx}">
                                    <div class="section-header" onclick="toggleSection('screenshots-${idx}')">
                                        <div class="section-title">
                                            <span>Screenshots</span>
                                            <span class="section-count">${report.screenshots.length}</span>
                                        </div>
                                        <div class="section-toggle">▼</div>
                                    </div>
                                    <div class="section-content">
                                        <div class="section-body">
                                            <div class="screenshots-grid">
                                                ${report.screenshots.map((path, imgIdx) => `
                                                    <div class="screenshot-item" onclick="openScreenshot(${idx}, ${imgIdx})">
                                                        <img src="/${path}" alt="Screenshot ${imgIdx + 1}" loading="lazy">
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Toggle report expand/collapse
        function toggleReport(idx) {
            const card = document.getElementById(`report-${idx}`);
            card.classList.toggle('expanded');
        }

        // Toggle section expand/collapse
        function toggleSection(id) {
            event.stopPropagation();
            const section = document.getElementById(id);
            section.classList.toggle('expanded');
        }

        // Delete report
        async function deleteReport(reportId, idx, event) {
            event.stopPropagation(); // Prevent card expansion

            if (!confirm('Are you sure you want to delete this test report? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/reports/${reportId}`, {
                    method: 'DELETE',
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to delete report');
                }

                // Remove from UI with animation
                const card = document.getElementById(`report-${idx}`);
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    // Remove from array and re-render
                    allReports = allReports.filter(r => r.id !== reportId);
                    updateStats();
                    renderReports();
                }, 300);

            } catch (error) {
                alert('Failed to delete report: ' + error.message);
            }
        }

        // Filter dropdown
        document.getElementById('filter-select').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderReports();
        });

        // Screenshot modal with navigation
        function openScreenshot(reportIdx, imgIdx) {
            const report = (currentFilter === 'all' ? allReports : allReports.filter(r => r.status === currentFilter))[reportIdx];
            currentImages = report.screenshots.map(path => `/${path}`);
            currentImageIndex = imgIdx;
            showImage();
            document.getElementById('screenshot-modal').classList.add('active');
        }

        function showImage() {
            document.getElementById('modal-image').src = currentImages[currentImageIndex];
            document.getElementById('modal-counter').textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
        }

        function navigateImage(direction) {
            currentImageIndex = (currentImageIndex + direction + currentImages.length) % currentImages.length;
            showImage();
        }

        // Close modal
        document.querySelector('.modal-close').addEventListener('click', () => {
            document.getElementById('screenshot-modal').classList.remove('active');
        });

        document.getElementById('screenshot-modal').addEventListener('click', (e) => {
            if (e.target.id === 'screenshot-modal') {
                e.target.classList.remove('active');
            }
        });

        // Arrow key navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('screenshot-modal');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    navigateImage(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateImage(1);
                } else if (e.key === 'Escape') {
                    modal.classList.remove('active');
                }
            }
        });

        // Load on start
        loadReports();

        // Auto-refresh every 30 seconds
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
