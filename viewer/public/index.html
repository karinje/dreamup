<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamUp QA Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .header {
            max-width: 1400px;
            margin: 0 auto 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .filter-btn:hover {
            border-color: #667eea;
            background: #334155;
        }

        .filter-btn.active {
            border-color: #667eea;
            background: #667eea;
        }

        .report-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-pass {
            background: #10b981;
            color: white;
        }

        .status-fail {
            background: #f59e0b;
            color: white;
        }

        .status-error {
            background: #ef4444;
            color: white;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
        }

        .report-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .meta-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .meta-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
        }

        .issues-section {
            margin: 20px 0;
        }

        .issue {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .issue.critical { border-left-color: #ef4444; }
        .issue.high { border-left-color: #f59e0b; }
        .issue.medium { border-left-color: #eab308; }
        .issue.low { border-left-color: #10b981; }

        .screenshots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .screenshot {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .screenshot:hover {
            transform: scale(1.05);
        }

        .screenshot img {
            width: 100%;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #94a3b8;
        }

        .empty {
            text-align: center;
            padding: 60px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px dashed #334155;
        }

        .empty h2 {
            margin-bottom: 10px;
            color: #94a3b8;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 DreamUp QA Reports</h1>
        <p>Autonomous browser game testing results</p>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Tests</button>
            <button class="filter-btn" data-filter="pass">✅ Passed</button>
            <button class="filter-btn" data-filter="fail">⚠️ Failed</button>
            <button class="filter-btn" data-filter="error">❌ Error</button>
        </div>

        <div id="reports-container">
            <div class="loading">Loading reports...</div>
        </div>
    </div>

    <div class="modal" id="screenshot-modal">
        <span class="modal-close">&times;</span>
        <img id="modal-image" src="" alt="Screenshot">
    </div>

    <script>
        let allReports = [];
        let currentFilter = 'all';

        // Load reports
        async function loadReports() {
            try {
                const response = await fetch('/api/reports');
                allReports = await response.json();
                renderReports();
            } catch (error) {
                document.getElementById('reports-container').innerHTML = `
                    <div class="empty">
                        <h2>Error loading reports</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render reports
        function renderReports() {
            const container = document.getElementById('reports-container');
            
            const filtered = currentFilter === 'all' 
                ? allReports 
                : allReports.filter(r => r.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <h2>No reports found</h2>
                        <p>Run a test with: <code>npx tsx src/cli.ts &lt;game-url&gt;</code></p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(report => `
                <div class="report-card">
                    <div class="report-header">
                        <div>
                            <h2>${report.metadata.game_url}</h2>
                            <p style="color: #94a3b8; margin-top: 5px;">
                                ${new Date(report.metadata.timestamp).toLocaleString()}
                            </p>
                        </div>
                        <div style="text-align: right;">
                            <div class="status-badge status-${report.status}">
                                ${report.status.toUpperCase()}
                            </div>
                            <div class="score">${report.playability_score}/100</div>
                        </div>
                    </div>

                    <div class="report-meta">
                        <div class="meta-item">
                            <div class="meta-label">Duration</div>
                            <div class="meta-value">${(report.metadata.duration_ms / 1000).toFixed(1)}s</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Confidence</div>
                            <div class="meta-value">${report.confidence_score}%</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Screenshots</div>
                            <div class="meta-value">${report.screenshots.length}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Issues</div>
                            <div class="meta-value">${report.issues.length}</div>
                        </div>
                    </div>

                    ${report.issues.length > 0 ? `
                        <div class="issues-section">
                            <h3 style="margin-bottom: 15px;">Issues Found</h3>
                            ${report.issues.map(issue => `
                                <div class="issue ${issue.severity}">
                                    <div style="font-size: 24px;">
                                        ${issue.severity === 'critical' ? '🔴' : 
                                          issue.severity === 'high' ? '🟠' : 
                                          issue.severity === 'medium' ? '🟡' : '🟢'}
                                    </div>
                                    <div style="flex: 1;">
                                        <strong style="text-transform: uppercase; font-size: 12px; color: #94a3b8;">
                                            ${issue.severity} - ${issue.category}
                                        </strong>
                                        <div style="margin-top: 5px;">${issue.description}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    ${report.gif ? `
                        <div style="margin-top: 25px;">
                            <h3 style="margin-bottom: 15px;">🎬 Gameplay Recording</h3>
                            <div style="background: #0f172a; border-radius: 8px; padding: 20px; text-align: center;">
                                <img src="/${report.gif}" alt="Gameplay GIF" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                                <div style="margin-top: 10px; color: #94a3b8; font-size: 14px;">
                                    Animated gameplay session
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${report.screenshots.length > 0 ? `
                        <div class="screenshots">
                            ${report.screenshots.map(path => `
                                <div class="screenshot" onclick="openScreenshot('/${path}')">
                                    <img src="/${path}" alt="Screenshot" loading="lazy">
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderReports();
            });
        });

        // Screenshot modal
        function openScreenshot(src) {
            const modal = document.getElementById('screenshot-modal');
            const img = document.getElementById('modal-image');
            img.src = src;
            modal.classList.add('active');
        }

        document.querySelector('.modal-close').addEventListener('click', () => {
            document.getElementById('screenshot-modal').classList.remove('active');
        });

        document.getElementById('screenshot-modal').addEventListener('click', (e) => {
            if (e.target.id === 'screenshot-modal') {
                e.target.classList.remove('active');
            }
        });

        // Load on start
        loadReports();

        // Auto-refresh every 30 seconds
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
