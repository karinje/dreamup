<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamUp QA Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Modern Header */
        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Dropdown Filter */
        .filter-dropdown {
            position: relative;
        }

        .filter-select {
            appearance: none;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #e2e8f0;
            padding: 10px 40px 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 150px;
        }

        .filter-select:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .filter-dropdown::after {
            content: '▼';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
            font-size: 10px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Report Cards */
        .report-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .batch-card {
            background: rgba(139, 92, 246, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .batch-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.25);
        }

        .batch-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            color: #c4b5fd;
        }

        .batch-summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-top: 20px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .batch-stat {
            text-align: center;
        }

        .batch-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .batch-stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .individual-runs-container {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.15);
        }

        .individual-runs-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .individual-run-label {
            font-size: 11px;
            color: #94a3b8;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            background: rgba(148, 163, 184, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .report-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .report-summary:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .report-summary-left {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .report-info {
            flex: 1;
        }

        .report-url {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .report-meta-line {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .report-meta-line span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .report-meta-line-secondary {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: #64748b;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }

        .report-meta-line-secondary span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(102, 126, 234, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.25);
            color: #a5b4fc;
        }

        .meta-badge svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
        }

        .meta-badge-model {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c4b5fd;
        }

        .meta-badge-context {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .report-summary-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .status-pass { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .status-fail { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        .status-error { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .score {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 80px;
            text-align: center;
        }

        .expand-icon {
            font-size: 18px;
            color: #94a3b8;
            transition: transform 0.3s;
        }

        .report-card.expanded .expand-icon {
            transform: rotate(180deg) !important;
        }

        .batch-card.expanded .expand-icon {
            transform: rotate(180deg) !important;
        }

        .individual-runs-container .report-card.expanded .expand-icon {
            transform: rotate(180deg) !important;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            opacity: 0.6;
            border-radius: 4px;
        }

        .delete-btn:hover {
            color: #ef4444;
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        .delete-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        /* Icon styles */
        .icon {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
        }

        /* Report Details */
        .report-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .report-card.expanded .report-details {
            max-height: 10000px;
        }

        .batch-card.expanded > .report-details {
            max-height: 10000px;
        }

        .report-content {
            padding: 0 28px 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Meta Grid */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .meta-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 14px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Test Config Section */
        .config-section {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin: 15px 0;
        }

        .config-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .config-badge {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .config-badge:hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .config-badge-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .config-badge-value {
            color: #e2e8f0;
            font-weight: 600;
        }

        .config-context-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }

        .config-context-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .config-context-text {
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Collapsible Sections */
        .collapsible-section {
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .section-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-count {
            background: rgba(102, 126, 234, 0.3);
            color: #a5b4fc;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .section-toggle {
            font-size: 14px;
            color: #94a3b8;
            transition: transform 0.3s;
        }

        .collapsible-section.expanded .section-toggle {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-section.expanded .section-content {
            max-height: 5000px;
        }

        .section-body {
            padding: 18px;
        }

        /* Issues */
        .issue {
            display: flex;
            gap: 12px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .issue.critical { border-left-color: #ef4444; }
        .issue.high { border-left-color: #f59e0b; }
        .issue.medium { border-left-color: #eab308; }
        .issue.low { border-left-color: #10b981; }

        .issue-icon {
            font-size: 22px;
        }

        .issue-content {
            flex: 1;
        }

        .issue-header {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .issue-text {
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* Observations Section */
        .observations-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .observation-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(102, 126, 234, 0.08);
            border-radius: 8px;
            border-left: 3px solid rgba(102, 126, 234, 0.4);
        }

        .observation-bullet {
            color: #818cf8;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        .observation-text {
            flex: 1;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* GIF Section */
        .gif-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .gif-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* Screenshots Grid */
        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .screenshot-item-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .screenshot-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            background: rgba(0, 0, 0, 0.3);
        }

        .screenshot-item:hover {
            transform: scale(1.05);
        }

        .screenshot-item img {
            width: 100%;
            display: block;
        }

        .screenshot-llm-info {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .screenshot-action {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        .action-keys {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #818cf8;
            background: rgba(102, 126, 234, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            flex: 1;
        }

        .screenshot-reasoning {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            color: #94a3b8;
            line-height: 1.4;
        }

        .reasoning-text {
            flex: 1;
            font-style: italic;
            font-size: 12px;
        }

        .temporal-context-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .temporal-context-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 8px;
        }

        .temporal-frame {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .temporal-frame-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 4px 8px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 30px;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.05);
        }

        .modal-nav.prev {
            left: 30px;
        }

        .modal-nav.next {
            right: 30px;
        }

        .modal-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Loading & Empty States */
        .loading, .empty {
            text-align: center;
            padding: 80px 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty {
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        .empty h2 {
            margin-bottom: 15px;
            color: #e2e8f0;
            font-size: 24px;
        }

        .empty p {
            color: #94a3b8;
            font-size: 14px;
        }

        .empty code {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            color: #a5b4fc;
            font-size: 13px;
        }

        .batch-result-badges {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .batch-result-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .batch-result-badge.inactive {
            opacity: 0.45;
            border-style: dashed;
        }

        .batch-result-badge.pass {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .batch-result-badge.fail {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.35);
            color: #fca5a5;
        }

        .batch-result-badge.error {
            background: rgba(250, 204, 21, 0.12);
            border-color: rgba(250, 204, 21, 0.35);
            color: #fcd34d;
        }

        .batch-summary-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .batch-summary-right .score {
            font-size: 28px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .batch-summary-right .score span {
            font-size: 16px;
            color: #94a3b8;
        }

        .batch-card.expanded > .report-details

        .individual-runs-container .report-card:not(.expanded) .report-details {
            max-height: 0 !important;
        }

        .individual-runs-container .report-card.expanded .report-details {
            max-height: 10000px !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 32px; height: 32px; stroke: #667eea;">
                        <line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/>
                        <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
                        <rect x="2" y="6" width="20" height="12" rx="2" fill="none"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>DreamUp QA</h1>
                    <p>Autonomous Game Testing</p>
                </div>
            </div>
            <div class="filter-dropdown">
                <select class="filter-select" id="filter-select">
                    <option value="all">All Tests</option>
                    <option value="pass">Passed</option>
                    <option value="fail">Failed</option>
                    <option value="error">Errors</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar" id="stats-bar" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="total-tests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passed-tests">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failed-tests">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-score">0</div>
                <div class="stat-label">Avg Score</div>
            </div>
        </div>

        <div id="reports-container">
            <div class="loading">Loading reports...</div>
        </div>
    </div>

    <!-- Screenshot Modal -->
    <div class="modal" id="screenshot-modal">
        <span class="modal-close">&times;</span>
        <button class="modal-nav prev" onclick="navigateImage(-1)">‹</button>
        <button class="modal-nav next" onclick="navigateImage(1)">›</button>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Screenshot">
        </div>
        <div class="modal-counter" id="modal-counter"></div>
    </div>

    <script>
        const REPORT_CARD_PREFIX = 'report-card-';
        const BATCH_CARD_PREFIX = 'batch-card-';
        const BATCH_RUN_PREFIX = 'batch-run-';

        let allReports = [];
        let individualReports = [];
        let batchReports = [];
        let individualReportMap = new Map();
        let currentFilter = 'all';
        let currentImages = [];
        let currentImageIndex = 0;
        let expandedBatchId = null;

        const expandedIndividualReports = new Set();
        const expandedIndividualRuns = new Set();
        const expandedSectionsByReport = new Map();
        const reportIdByCardKey = new Map();
        const batchRunLookup = new Map();

        const sanitizeForId = (value) => String(value ?? '').replace(/[^a-zA-Z0-9_-]/g, '_');

        const getReportTimestamp = (report) => {
            if (!report) return 0;
            if (report.type === 'batch') {
                return new Date(report.timestamp || report.created_at || 0).getTime();
            }
            const metadata = report.metadata || {};
            return new Date(metadata.timestamp || report.timestamp || 0).getTime();
        };

        const getReportById = (reportId) => {
            if (!reportId) return null;
            if (individualReportMap.has(reportId)) {
                return individualReportMap.get(reportId);
            }
            return allReports.find((report) => report.id === reportId) || null;
        };

        const indexIndividualReports = (reports) => {
            individualReportMap = new Map();
            reports.forEach((report) => {
                if (report && report.id) {
                    individualReportMap.set(report.id, report);
                }
            });
        };

        const getFilteredReports = () => {
            if (currentFilter === 'all') {
                return allReports.slice();
            }
            return allReports.filter((report) => {
                if (report.type === 'batch') return true;
                return report.status === currentFilter;
            });
        };

        async function loadReports() {
            try {
                const response = await fetch('/api/reports');
                const data = await response.json();

                if (Array.isArray(data)) {
                    batchReports = data.filter((item) => item?.type === 'batch');
                    individualReports = data.filter((item) => item?.type !== 'batch');
                } else {
                    batchReports = Array.isArray(data.batch) ? data.batch : [];
                    individualReports = Array.isArray(data.individual) ? data.individual : [];
                }

                indexIndividualReports(individualReports);

                const batchedIds = new Set();
                batchReports.forEach((batch) => {
                    if (Array.isArray(batch.results)) {
                        batch.results.forEach((result) => {
                            if (result?.reportId) {
                                batchedIds.add(result.reportId);
                            }
                        });
                    }
                });

                const standaloneIndividuals = individualReports.filter((report) => !batchedIds.has(report.id));

                allReports = [...batchReports, ...standaloneIndividuals].sort((a, b) => getReportTimestamp(b) - getReportTimestamp(a));

                updateStats();
                renderReports();
            } catch (error) {
                document.getElementById('reports-container').innerHTML = `
                    <div class="empty">
                        <h2>Error loading reports</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            if (individualReports.length === 0 && batchReports.length === 0) {
                document.getElementById('stats-bar').style.display = 'none';
                return;
            }

            document.getElementById('stats-bar').style.display = 'grid';

            const passed = individualReports.filter((report) => report.status === 'pass').length;
            const failed = individualReports.filter((report) => report.status === 'fail').length;
            const avgScore = individualReports.length > 0
                ? Math.round(individualReports.reduce((sum, report) => sum + (report.playability_score || 0), 0) / individualReports.length)
                : 0;

            document.getElementById('total-tests').textContent = individualReports.length + batchReports.length;
            document.getElementById('passed-tests').textContent = passed;
            document.getElementById('failed-tests').textContent = failed;
            document.getElementById('avg-score').textContent = avgScore;
        }

        function renderReports() {
            const container = document.getElementById('reports-container');
            if (!container) return;

            const filtered = getFilteredReports();
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <h2>No reports found</h2>
                        <p>Run a test with: <code>npx tsx src/cli.ts &lt;game-url&gt;</code></p>
                    </div>
                `;
                return;
            }

            reportIdByCardKey.clear();
            batchRunLookup.clear();

            container.innerHTML = filtered.map((report, idx) => {
                if (report.type === 'batch') {
                    return renderBatchReport(report, idx);
                }
                return renderIndividualReport(report, idx);
            }).join('');

            filtered.forEach((report, idx) => {
                if (report.type === 'batch' && report.id === expandedBatchId) {
                    toggleBatchReport(report.id, idx, true);
                }
            });
        }

        function renderIndividualReport(report, idx) {
            const metadata = report.metadata || {};
            const testConfig = metadata.test_config || {};
            const cardKey = sanitizeForId(report.id || idx);
            const cardId = `${REPORT_CARD_PREFIX}${cardKey}`;
            const isExpanded = expandedIndividualReports.has(report.id);
            const screenshotCount = Array.isArray(report.screenshots) ? report.screenshots.length : 0;

            reportIdByCardKey.set(cardKey, report.id);

            return `
                <div class="report-card ${isExpanded ? 'expanded' : ''}" id="${cardId}" data-report-id="${report.id}" data-card-key="${cardKey}">
                    <div class="report-summary" onclick="toggleIndividualReport('${report.id}', '${cardKey}')">
                        <div class="report-summary-left">
                            <button class="delete-btn" onclick="deleteReport('${report.id}', 'individual', event)" title="Delete report">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"/>
                                </svg>
                            </button>
                            <div class="report-info">
                                <div class="report-url">${metadata.game_url || report.gameUrl || 'Unknown'}</div>
                                <div class="report-meta-line">
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                                        ${new Date(metadata.timestamp || report.timestamp || Date.now()).toLocaleString()}
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 3"/></svg></span>
                                        ${((metadata.duration_ms || report.duration_ms || 0) / 1000).toFixed(1)}s
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
                                        ${screenshotCount} screenshots
                                    </span>
                                </div>
                                <div class="report-meta-line-secondary">
                                    <span class="meta-badge meta-badge-model">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                        ${metadata.llm_model || 'N/A'}${metadata.reasoning_effort ? ` · ${metadata.reasoning_effort}` : ''}
                                    </span>
                                    ${testConfig.timeout_ms ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 3"/></svg>
                                            ${(testConfig.timeout_ms / 60000).toFixed(1)} min
                                        </span>
                                    ` : ''}
                                    ${testConfig.pause_interval ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                            ${testConfig.pause_interval}s
                                        </span>
                                    ` : ''}
                                    ${testConfig.game_speed ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                            ${testConfig.game_speed}%
                                        </span>
                                    ` : ''}
                                    ${testConfig.quick_test ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                            Quick Test
                                        </span>
                                    ` : ''}
                                    ${testConfig.has_input_hints ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01"/></svg>
                                            Input Hints
                                        </span>
                                    ` : ''}
                                    ${testConfig.has_game_context ? `
                                        <span class="meta-badge meta-badge-context">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                                            Context
                                        </span>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="report-summary-right">
                            <div class="status-badge status-${report.status}">
                                ${report.status}
                            </div>
                            <div class="score">${report.playability_score}<span style="font-size: 16px; color: #94a3b8;">/100</span></div>
                            <div class="expand-icon">▼</div>
                        </div>
                    </div>
                    <div class="report-details">
                        ${renderReportDetails(report, cardKey)}
                    </div>
                </div>
            `;
        }

        function renderBatchReport(batch, idx) {
            const config = batch.config || {};
            const summary = batch.summary || {};
            const batchKey = sanitizeForId(batch.id || idx);
            const cardId = `${BATCH_CARD_PREFIX}${batchKey}`;
            const testsTotal = summary.total ?? (Array.isArray(batch.results) ? batch.results.length : 0);
            const gamesCount = Array.isArray(config.games) ? config.games.length : 0;
            const maxParallel = config.maxParallel ?? config.max_parallel ?? config.parallel ?? 1;
            const isExpanded = expandedBatchId === batch.id;
            const passCount = summary.passed ?? 0;
            const failCount = summary.failed ?? 0;
            const errorCount = summary.errors ?? 0;
            const passBadgeClass = `batch-result-badge pass${passCount === 0 ? ' inactive' : ''}`;
            const failBadgeClass = `batch-result-badge fail${failCount === 0 ? ' inactive' : ''}`;
            const errorBadgeClass = `batch-result-badge error${errorCount === 0 ? ' inactive' : ''}`;

            return `
                <div class="batch-card ${isExpanded ? 'expanded' : ''}" id="${cardId}" data-batch-id="${batch.id}" data-card-key="${batchKey}">
                    <div class="report-summary" onclick="toggleBatchReport('${batch.id}', ${idx})">
                        <div class="report-summary-left">
                            <button class="delete-btn" onclick="deleteReport('${batch.id}', 'batch', event)" title="Delete batch report">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"/>
                                </svg>
                            </button>
                            <div class="report-info">
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                    <span class="batch-badge">📦 Batch Test</span>
                                    <div class="report-url" style="margin: 0;">${gamesCount} game${gamesCount === 1 ? '' : 's'} · ${testsTotal} run${testsTotal === 1 ? '' : 's'}</div>
                                </div>
                                <div class="report-meta-line">
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                                        ${new Date(batch.timestamp || batch.created_at || Date.now()).toLocaleString()}
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 3"/></svg></span>
                                        ${((batch.duration_ms || 0) / 1000).toFixed(1)}s
                                    </span>
                                    <span>
                                        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                                        ${maxParallel} parallel
                                    </span>
                                </div>
                                <div class="report-meta-line-secondary">
                                    ${Array.isArray(config.models) && config.models.length ? `
                                        <span class="meta-badge">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                            ${config.models.length} model${config.models.length === 1 ? '' : 's'}
                                        </span>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="report-summary-right">
                            <div class="batch-summary-right">
                                <div class="batch-result-badges">
                                    <span class="${passBadgeClass}">${passCount} pass</span>
                                    <span class="${failBadgeClass}">${failCount} fail</span>
                                    <span class="${errorBadgeClass}">${errorCount} error</span>
                                </div>
                                <div class="score">${summary.avg_playability_score ?? '—'}<span style="font-size: 16px; color: #94a3b8;">/100</span></div>
                            </div>
                            <div class="expand-icon">▼</div>
                        </div>
                    </div>
                    <div class="report-details">
                        <div class="report-content">
                            <div class="batch-summary-stats">
                                <div class="batch-stat">
                                    <div class="batch-stat-value">${summary.total ?? testsTotal}</div>
                                    <div class="batch-stat-label">Total Tests</div>
                                </div>
                                <div class="batch-stat">
                                    <div class="batch-stat-value" style="color: #10b981;">${summary.passed ?? 0}</div>
                                    <div class="batch-stat-label">Passed</div>
                                </div>
                                <div class="batch-stat">
                                    <div class="batch-stat-value" style="color: #f59e0b;">${summary.failed ?? 0}</div>
                                    <div class="batch-stat-label">Failed</div>
                                </div>
                                <div class="batch-stat">
                                    <div class="batch-stat-value" style="color: #ef4444;">${summary.errors ?? 0}</div>
                                    <div class="batch-stat-label">Errors</div>
                                </div>
                                <div class="batch-stat">
                                    <div class="batch-stat-value">${summary.avg_playability_score ?? '—'}</div>
                                    <div class="batch-stat-label">Avg Score</div>
                                </div>
                                <div class="batch-stat">
                                    <div class="batch-stat-value">${summary.avg_confidence_score != null ? `${summary.avg_confidence_score}%` : '—'}</div>
                                    <div class="batch-stat-label">Avg Confidence</div>
                                </div>
                            </div>
                            <div class="individual-runs-container">
                                <div class="individual-runs-header">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; stroke: #cbd5e1;">
                                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                                    </svg>
                                    Individual Test Runs (${testsTotal})
                                </div>
                                <div id="batch-runs-${batchKey}" data-batch-id="${batch.id}">
                                    ${isExpanded ? '<div style="text-align: center; padding: 20px; color: #94a3b8;">Loading individual runs...</div>' : '<div style="text-align: center; padding: 20px; color: #94a3b8;">Expand to load individual runs</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadBatchDetails(batchId) {
            const response = await fetch(`/api/batch/${batchId}`);
            if (!response.ok) {
                throw new Error(`Failed to load batch details (${response.status})`);
            }
            return response.json();
        }

        function updateExpandIcon(icon, isExpanded) {
            if (!icon) return;
            icon.textContent = isExpanded ? '▲' : '▼';
            icon.style.transform = isExpanded ? 'rotate(180deg)' : '';
        }

        function toggleIndividualReport(reportId, cardKey) {
            const card = document.getElementById(`${REPORT_CARD_PREFIX}${cardKey}`);
            if (!card) return;
            const isExpanded = card.classList.toggle('expanded');
            const icon = card.querySelector('.expand-icon');
            updateExpandIcon(icon, isExpanded);
            if (isExpanded) {
                expandedIndividualReports.add(reportId);
            } else {
                expandedIndividualReports.delete(reportId);
                expandedSectionsByReport.delete(reportId);
            }
        }

        function toggleBatchRun(runKey) {
            const card = document.getElementById(`${BATCH_RUN_PREFIX}${runKey}`);
            if (!card) return;
            const info = batchRunLookup.get(runKey);
            const isExpanded = card.classList.toggle('expanded');
            const icon = card.querySelector('.expand-icon');
            updateExpandIcon(icon, isExpanded);
            if (isExpanded) {
                expandedIndividualRuns.add(runKey);
            } else {
                expandedIndividualRuns.delete(runKey);
                if (info?.report?.id) {
                    expandedSectionsByReport.delete(info.report.id);
                }
            }
        }

        async function toggleBatchReport(batchId, idx, keepOpen = false) {
            const filtered = getFilteredReports();
            const batch = filtered[idx];
            if (!batch || batch.type !== 'batch') return;

            const batchKey = sanitizeForId(batch.id || idx);
            const card = document.getElementById(`${BATCH_CARD_PREFIX}${batchKey}`);
            if (!card) return;

            const runsContainer = document.getElementById(`batch-runs-${batchKey}`);
            const icon = card.querySelector('.expand-icon');
            const isExpanded = card.classList.contains('expanded');

            if (isExpanded && !keepOpen) {
                card.classList.remove('expanded');
                updateExpandIcon(icon, false);
                expandedBatchId = null;
                if (runsContainer) {
                    runsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: #94a3b8;">Expand to load individual runs</div>';
                }
                Array.from(batchRunLookup.entries()).forEach(([key, info]) => {
                    if (info?.batchId === batch.id) {
                        batchRunLookup.delete(key);
                        expandedIndividualRuns.delete(key);
                    }
                });
                return;
            }

            card.classList.add('expanded');
            updateExpandIcon(icon, true);
            expandedBatchId = batch.id;

            if (runsContainer) {
                runsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: #94a3b8;">Loading individual runs...</div>';
            }

            try {
                const batchData = await loadBatchDetails(batch.id);
                const resolvedBatch = batchData?.batch || batch;
                const individualList = batchData?.individualReports || [];
                const results = resolvedBatch.results || batch.results || [];
                renderIndividualRuns(resolvedBatch, batchKey, individualList, results);
            } catch (error) {
                if (runsContainer) {
                    runsContainer.innerHTML = `<div style="text-align: center; padding: 20px; color: #ef4444;">${error.message}</div>`;
                }
            }
        }

        function renderIndividualRuns(batch, batchKey, individualList, results) {
            const container = document.getElementById(`batch-runs-${batchKey}`);
            if (!container) return;

            // Reset any lingering expanded state for this batch before rendering
            Array.from(expandedIndividualRuns).forEach((key) => {
                const info = batchRunLookup.get(key);
                if (!info || info.batchId === batch.id) {
                    expandedIndividualRuns.delete(key);
                }
            });

            const reportMap = new Map();
            (individualList || []).forEach((report) => {
                if (report && report.id) {
                    reportMap.set(report.id, report);
                }
            });

            const runKeys = new Set();
            const presentReportIds = new Set();

            const html = (results || []).map((result, runIdx) => {
                const runKey = sanitizeForId(`${batch.id || batchKey}-${runIdx}`);
                runKeys.add(runKey);

                const rawReport = result.reportId ? (reportMap.get(result.reportId) || individualReportMap.get(result.reportId)) : result.report;
                const report = rawReport || null;
                const gameUrl = result.gameUrl || result.game_url || report?.metadata?.game_url || batch.gameUrl || 'Unknown';
                const isExpanded = expandedIndividualRuns.has(runKey);

                batchRunLookup.set(runKey, { batchId: batch.id, runIdx, result, report });
                if (report && report.id) {
                    reportIdByCardKey.set(runKey, report.id);
                    presentReportIds.add(report.id);
                }

                return renderFullReportCard(report, runKey, isExpanded, gameUrl, result.label);
            }).join('');

            expandedIndividualRuns.forEach((key) => {
                if (!runKeys.has(key)) {
                    expandedIndividualRuns.delete(key);
                }
            });

            expandedSectionsByReport.forEach((_, reportId) => {
                if (!presentReportIds.has(reportId) && !individualReportMap.has(reportId)) {
                    expandedSectionsByReport.delete(reportId);
                }
            });

            batchRunLookup.forEach((info, key) => {
                if (info?.batchId === batch.id && !runKeys.has(key)) {
                    batchRunLookup.delete(key);
                }
            });

            container.innerHTML = html || '<div style="text-align: center; padding: 20px; color: #94a3b8;">No runs recorded</div>';

        function toggleSection(sectionId, evt) {
            if (evt) evt.stopPropagation();
            const section = document.getElementById(sectionId);
            if (!section) return;
            section.classList.toggle('expanded');
            const [sectionName, cardKey] = sectionId.split('--');
            if (!cardKey) return;
            const reportId = reportIdByCardKey.get(cardKey) || batchRunLookup.get(cardKey)?.result?.reportId || batchRunLookup.get(cardKey)?.report?.id;
            if (!reportId) return;
            let sectionSet = expandedSectionsByReport.get(reportId);
            if (!sectionSet) {
                sectionSet = new Set();
                expandedSectionsByReport.set(reportId, sectionSet);
            }
            if (section.classList.contains('expanded')) {
                sectionSet.add(sectionName);
            } else {
                sectionSet.delete(sectionName);
            }
        }

        async function deleteReport(reportId, type, evt) {
            if (evt) evt.stopPropagation();
            const isBatch = type === 'batch';
            const message = isBatch
                ? 'Delete this batch report and all associated runs?'
                : 'Delete this test report?';
            if (!confirm(message)) {
                return;
            }
            try {
                const response = await fetch(`/api/reports/${reportId}`, { method: 'DELETE' });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || 'Failed to delete report');
                }

                if (isBatch) {
                    const targetBatch = batchReports.find((report) => report.id === reportId)
                        || allReports.find((report) => report.id === reportId && report.type === 'batch');
                    const embeddedIds = new Set();

                    if (targetBatch && Array.isArray(targetBatch.results)) {
                        targetBatch.results.forEach((result) => {
                            if (result?.reportId) {
                                embeddedIds.add(result.reportId);
                            }
                            if (result?.report?.id) {
                                embeddedIds.add(result.report.id);
                            }
                        });
                    }

                    batchReports = batchReports.filter((report) => report.id !== reportId);
                    allReports = allReports.filter((report) => report.id !== reportId);
                    expandedBatchId = expandedBatchId === reportId ? null : expandedBatchId;

                    Array.from(batchRunLookup.entries()).forEach(([key, info]) => {
                        if (info?.batchId === reportId) {
                            batchRunLookup.delete(key);
                            expandedIndividualRuns.delete(key);
                        }
                    });

                    if (embeddedIds.size > 0) {
                        individualReports = individualReports.filter((report) => !embeddedIds.has(report.id));
                        embeddedIds.forEach((id) => {
                            expandedIndividualReports.delete(id);
                            expandedSectionsByReport.delete(id);
                        });
                    }
                } else {
                    individualReports = individualReports.filter((report) => report.id !== reportId);
                    allReports = allReports.filter((report) => report.id !== reportId);
                    expandedIndividualReports.delete(reportId);
                    expandedSectionsByReport.delete(reportId);
                }

                indexIndividualReports(individualReports);
                updateStats();
                renderReports();
            } catch (error) {
                alert(`Failed to delete report: ${error.message}`);
            }
        }

        function openScreenshot(identifier, imgIdx) {
            let report = null;

            if (typeof identifier === 'string') {
                const reportId = reportIdByCardKey.get(identifier);
                if (reportId) {
                    report = getReportById(reportId);
                }
                if (!report && batchRunLookup.has(identifier)) {
                    const info = batchRunLookup.get(identifier);
                    report = info?.report || getReportById(info?.result?.reportId);
                    if (!report && info?.batchId) {
                        loadBatchDetails(info.batchId).then((data) => {
                            const runReport = data?.individualReports?.find((item) => item.id === info?.result?.reportId) || null;
                            if (runReport && Array.isArray(runReport.screenshots) && runReport.screenshots.length > 0) {
                                currentImages = runReport.screenshots.map((path) => `/${path}`);
                                currentImageIndex = imgIdx;
                                showImage();
                                document.getElementById('screenshot-modal').classList.add('active');
                            }
                        }).catch((error) => console.error('Failed to load batch details for screenshot:', error));
                        return;
                    }
                }
            } else {
                const idx = parseInt(identifier, 10);
                if (!Number.isNaN(idx)) {
                    const filtered = getFilteredReports();
                    report = filtered[idx];
                }
            }

            if (!report || !Array.isArray(report.screenshots) || report.screenshots.length === 0) {
                return;
            }

            currentImages = report.screenshots.map((path) => `/${path}`);
            currentImageIndex = imgIdx;
            showImage();
            document.getElementById('screenshot-modal').classList.add('active');
        }

        function showImage() {
            document.getElementById('modal-image').src = currentImages[currentImageIndex];
            document.getElementById('modal-counter').textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
        }

        function navigateImage(direction) {
            currentImageIndex = (currentImageIndex + direction + currentImages.length) % currentImages.length;
            showImage();
        }

        document.getElementById('filter-select').addEventListener('change', (event) => {
            currentFilter = event.target.value;
            renderReports();
        });

        document.querySelector('.modal-close').addEventListener('click', () => {
            document.getElementById('screenshot-modal').classList.remove('active');
        });

        document.getElementById('screenshot-modal').addEventListener('click', (event) => {
            if (event.target.id === 'screenshot-modal') {
                event.target.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (event) => {
            const modal = document.getElementById('screenshot-modal');
            if (!modal.classList.contains('active')) return;
            if (event.key === 'ArrowLeft') navigateImage(-1);
            if (event.key === 'ArrowRight') navigateImage(1);
            if (event.key === 'Escape') modal.classList.remove('active');
        });

        Object.assign(window, {
            loadReports,
            toggleBatchReport,
            toggleBatchRun,
            toggleIndividualReport,
            toggleSection,
            deleteReport,
            openScreenshot
        });

        loadReports();
        setInterval(loadReports, 30000);
    </script>
</body>
</html>
